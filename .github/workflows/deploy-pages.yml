name: Test, scrape, and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 6,12,18 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold OCR cache can require local Tesseract fallbacks for several posters.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore AI and OCR caches
        uses: actions/cache@v5
        with:
          path: |
            data/ocr-cache
            data/ai-cache
          key: ai-ocr-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ai-ocr-v3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Download the currently deployed dataset
        run: |
          mkdir -p .cache
          cp public/data/events.json .cache/previous-events.json
          if curl --fail --silent --show-error --location \
            https://inwt2333.github.io/Classic-Music/data/events.json \
            --output .cache/deployed-events.json; then
            mv .cache/deployed-events.json .cache/previous-events.json
          else
            echo "::warning::No deployed dataset available; using the committed dataset as baseline."
          fi

      - name: Run parser and storage tests
        run: |
          npm run test:parser
          npm run test:data

      - name: Scrape official sources
        env:
          PREVIOUS_DATASET_PATH: .cache/previous-events.json
          SHOAC_OCR_MAX_IMAGES: "3"
          SJTU_AI_API_KEY: ${{ secrets.SJTU_AI_API_KEY || secrets.DEEPSEEK_API_KEY }}
          SJTU_AI_BASE_URL: ${{ vars.SJTU_AI_BASE_URL }}
          SJTU_PROGRAM_MODEL: ${{ vars.SJTU_PROGRAM_MODEL }}
          SJTU_VISION_MODEL: ${{ vars.SJTU_VISION_MODEL }}
          SJTU_VISION_TIMEOUT_MS: "120000"
          PROGRAM_AI_MAX_REVIEWS: "60"
        run: npm run scrape:ai

      - name: Audit generated data
        run: |
          npm run audit:data:deploy
          npm run audit:storage

      - name: Validate frontend account configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing Actions variable VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing Actions variable VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          npm run auth:verify

      - name: Build
        env:
          VITE_BASE_PATH: /Classic-Music/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
