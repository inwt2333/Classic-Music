name: Test, scrape, and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 6,12,18 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.14"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore OCR cache
        uses: actions/cache@v5
        with:
          path: data/ocr-cache
          key: ocr-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ocr-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Download the currently deployed dataset
        run: |
          mkdir -p .cache
          cp public/data/events.json .cache/previous-events.json
          if curl --fail --silent --show-error --location \
            https://inwt2333.github.io/Classic-Music/data/events.json \
            --output .cache/deployed-events.json; then
            mv .cache/deployed-events.json .cache/previous-events.json
          else
            echo "::warning::No deployed dataset available; using the committed dataset as baseline."
          fi

      - name: Run parser and storage tests
        run: |
          npm run test:parser
          npm run test:data

      - name: Scrape official sources
        env:
          PREVIOUS_DATASET_PATH: .cache/previous-events.json
          SHOAC_OCR_MAX_IMAGES: "3"
        run: npm run scrape

      - name: Audit generated data
        run: |
          npm run audit:data:deploy
          npm run audit:storage

      - name: Build
        env:
          VITE_BASE_PATH: /Classic-Music/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
