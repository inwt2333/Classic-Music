name: Apply Remote Reviews

on:
  schedule:
    # 每 3 小时拉取一次远程审核队列（09:11/12:11/... Asia/Shanghai）
    - cron: "11 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull and apply remote review submissions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/pull-remote-reviews.ts

      - name: Commit applied reviews
        run: |
          git config user.name "classic-music-review-bot"
          git config user.email "classic-music-review-bot@users.noreply.github.com"
          git add data/manual-reviews.json
          if git diff --cached --quiet; then
            echo "没有新的审核结果需要提交"
          else
            git commit -m "chore(review): apply remote review submissions"
            git push origin main
          fi
