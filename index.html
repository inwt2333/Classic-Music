<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%app-icon-180.png" />
    <meta
      name="description"
      content="全国古典音乐演出日历：按时间、城市、场馆、曲目和人物查找音乐会。"
    />
    <title>古典乐演出日历</title>
    <style>
      .boot-shell {
        min-height: 100vh;
        color: #202725;
        background: #e9edeb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .boot-header {
        display: flex;
        min-height: 70px;
        padding: 14px clamp(18px, 4vw, 56px);
        align-items: center;
        gap: 12px;
        color: #f7f8f7;
        background: #1d302d;
      }
      .boot-header img { width: 40px; height: 40px; border-radius: 6px; }
      .boot-header strong { display: block; font-size: 17px; }
      .boot-header span { color: #bdc9c5; font-size: 12px; }
      .boot-main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: clamp(36px, 8vh, 80px) 0;
      }
      .boot-image {
        height: clamp(180px, 30vw, 320px);
        background: #d7dfdc;
        border-radius: 6px;
      }
      .boot-message { margin: 24px 0 10px; font-size: 16px; font-weight: 700; }
      .boot-subtitle { margin: 0; color: #68736f; font-size: 13px; }
      .boot-line {
        width: min(680px, 88%);
        height: 12px;
        margin-top: 28px;
        background: #d7dfdc;
        border-radius: 3px;
      }
      .boot-line.short { width: min(420px, 62%); margin-top: 12px; }
      @media (max-width: 600px) {
        .boot-header { min-height: 62px; padding: 12px 16px; }
        .boot-main { width: calc(100% - 24px); padding-top: 20px; }
        .boot-image { height: 188px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="正在加载古典乐演出日历">
        <header class="boot-header">
          <img src="%BASE_URL%brand-logo.png" alt="" aria-hidden="true" />
          <div><strong>古典乐演出日历</strong><span>全国演出 · 持续更新</span></div>
        </header>
        <section class="boot-main">
          <div class="boot-image" aria-hidden="true"></div>
          <p class="boot-message">正在加载最新演出</p>
          <p class="boot-subtitle">首次访问可能需要几秒钟，请稍候。</p>
          <div class="boot-line" aria-hidden="true"></div>
          <div class="boot-line short" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <script>
      (() => {
        if (!("serviceWorker" in navigator)) return;
        const appBase = "%BASE_URL%";
        const cleanupKey = `classic-music-cache-cleanup:${appBase}`;
        navigator.serviceWorker.getRegistrations().then(async (registrations) => {
          const owned = registrations.filter((registration) => {
            try {
              return new URL(registration.scope).pathname === appBase;
            } catch {
              return false;
            }
          });
          if (!owned.length) return;

          const wasControlled = Boolean(navigator.serviceWorker.controller);
          await Promise.all(owned.map((registration) => registration.unregister()));
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(
              names.filter((name) => name.startsWith("classic-music-")).map((name) => caches.delete(name)),
            );
          }

          if (!wasControlled) return;
          try {
            if (sessionStorage.getItem(cleanupKey)) return;
            sessionStorage.setItem(cleanupKey, "1");
            window.location.reload();
          } catch {
            // The current page remains usable if private browsing blocks storage.
          }
        }).catch(() => undefined);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
